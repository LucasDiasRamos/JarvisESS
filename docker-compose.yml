services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3001
      DB_PATH: /app/data/jarvis.db
      JARVIS_LLM_API_KEY: ${JARVIS_LLM_API_KEY:-}
      JARVIS_LLM_BASE_URL: ${JARVIS_LLM_BASE_URL:-}
      JARVIS_LLM_MODEL: ${JARVIS_LLM_MODEL:-google/gemma-3-12b-it}
      JARVIS_LLM_TIMEOUT: ${JARVIS_LLM_TIMEOUT:-30}
      JARVIS_LOG_DIR: /app/data/logs
      JARVIS_TIMEZONE: ${JARVIS_TIMEZONE:-America/Cuiaba}
      TZ: ${TZ:-America/Cuiaba}
    ports:
      - "3001:3001"
    volumes:
      - jarvis-data:/app/data
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed:ro
      - ./data/chroma_db:/app/data/chroma_db
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "5173:80"
    volumes:
      - jarvis-data:/data:ro
      - ./data/raw:/data/raw:ro
      - ./data/processed:/data/processed:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  jarvis-data:
